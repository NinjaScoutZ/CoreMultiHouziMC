      name: "Chameleon"
      desc:
        - "&7สายพื้นฐานของ Hider ที่ชนะด้วยการเนียนไปกับฉาก"
        - "&7ใช้ Decoy หลอกให้ Hunter เช็กผิดและเสียจังหวะ"
        - ""
        - "&aPros: &fเก่งเรื่องหลอกเช็กห้องและบังคับให้ตีพลาด"
        - "&cCons: &fถ้าโดนเปิดตำแหน่งแล้วจะหนียาก"
    ghost:
      name: "Ghost"
      desc:
        - "&7สายวาร์ปหนีที่ตัดเส้นไล่ล่าด้วยการทะลุกำแพง"
        - "&7เด่นตอนโดนกดดันใกล้ตัวและต้องรีเซ็ต line-of-sight"
        - ""
        - "&aPros: &fหนีผ่านมุมแคบและกำแพงได้ดีมาก"
        - "&cCons: &fเสียงและเอฟเฟกต์ทำให้ยังถูกตามรอยได้"
    trickster:
      name: "Trickster"
      desc:
        - "&7สายป่วนที่เอาตัวรอดด้วยการเปลี่ยนจังหวะไล่จับ"
        - "&7วิ่งไว ตีตาบอด แล้วต้องรีบสลับเส้นหนีทันที"
        - ""
        - "&aPros: &fความเร็วสูงและตีคนหาให้เสียมุมมองได้"
        - "&cCons: &fรอยหิมะทำให้วิ่งวนเส้นเดิมแล้วโดนอ่านง่าย"
    bomb_bug:
      name: "Bomb Bug"
      desc:
        - "&7สายกับดักที่สวน Hunter ได้จริงด้วยระเบิดปิดงาน"
        - "&7วางเหยื่อในจุดที่ดูน่าตี แล้วปล่อยให้การเช็กโลภจ่ายเลือดจริง"
        - ""
        - "&aPros: &fแรงพอจะสวน Hunter ที่เช็กโลภ"
        - "&cCons: &fต้องวางจุดให้เนียน ไม่งั้นเสียของฟรี"
    locksmith:
      name: "Locksmith"
      desc:
        - "&7สายเปิดเส้นทางลับที่เด่นกับมุมคับแคบและกำแพงหลอกตา"
        - "&7เหมาะกับแมพที่หนีด้วย route play มากกว่าวิ่งตรง"
        - ""
        - "&aPros: &fตัดเส้นไล่ล่าด้วยทางลัดและการหักมุมได้ดี"
        - "&cCons: &fถ้าแมพไม่มีช่องให้เล่นจะดึง value ได้น้อย"
    mimic:
      name: "Mimic"
      desc:
        - "&7สายภาพลวงตาที่หลอกความสนใจแล้วค่อยเปลี่ยนตำแหน่ง"
        - "&7เด่นเวลาโดนไล่แบบตัวต่อตัวและต้องซื้อเสี้ยววินาทีหนี"
        - ""
        - "&aPros: &fดึงสายตา Hunter ออกจากเส้นหนีจริงได้ดี"
        - "&cCons: &fภาพลวงหมดเร็วถ้าคู่ต่อสู้ไม่รีบ commit"
    tracker:
      name: "Tracker"
      desc:
        - "&7นักล่าสาย scout ที่ค่อย ๆ บีบพื้นที่ก่อนทีมจะ commit"
        - "&7ใช้ Scanner Pulse เช็ก sector แล้วหมุนแมพด้วย Double Jump"
        - ""
        - "&aPros: &fได้ข้อมูลชัวร์และขึ้นเปลี่ยนชั้นได้คล่อง"
        - "&cCons: &fถ้าทีมไม่ตามข้อมูลก็ปิดงานเองยาก"
    destroyer:
      name: "Destroyer"
      desc:
        - "&7นักล่าคุมห้องที่ใช้แรงกดดันเปิดจุดซ่อนต้องสงสัย"
        - "&7Flare ช่วย reveal เป้าหมายก่อนเดินเข้าเคลียร์พื้นที่"
        - ""
        - "&aPros: &fเก่งมากกับห้องแน่นและจุดซ่อนที่อ่านยาก"
        - "&cCons: &fย้ายจุดช้ากว่าสาย scout"
    trapper:
      name: "Trapper"
      desc:
        - "&7นักล่าสายคุมเส้นหนีที่ชนะด้วยการปิดทางมากกว่า reveal ตรง"
        - "&7ใยแมงมุมและธนูทำให้ choke point กลายเป็นจุดตาย"
        - ""
        - "&aPros: &fดักจับเก่งมากและไล่ซ้ำหลังติดใยได้ไว"
        - "&cCons: &fถ้าเปิดไฟต์ในที่โล่งจะบางกว่าสายอื่น"
    bloodhound:
      name: "Bloodhound"
      desc:
        - "&7นักล่าสายตามรอยที่เปลี่ยนการเห็นครั้งแรกให้เป็นการไล่ต่อเนื่อง"
        - "&7เด่นมากกับเป้าหมายที่เพิ่งหลุดมุมหรือพยายามรีเซ็ตเส้นหนี"
        - ""
        - "&aPros: &fตามติดเป้าหมายเดี่ยวได้โหดและกดดันต่อเนื่อง"
        - "&cCons: &fไม่เก่งเรื่องเปิดหลายเป้าพร้อมกัน"
    saboteur:
      name: "Saboteur"
      desc:
        - "&7นักล่าสาย disruption ที่เปิดไฟต์ให้ทีมได้ก่อน"
        - "&7Smoke Bomb ทำให้ Hider มองไม่เห็นและหนีช้าลงพร้อมกัน"
        - ""
        - "&aPros: &fเก่งมากในการเปิดจังหวะบุกและตัดการมองเห็น"
        - "&cCons: &fถ้าเข้าไม่ถึงหลังใช้สกิลจะเสีย value เยอะ"
    bounty_hunter:
      name: "Bounty Hunter"
      desc:
        - "&7นักล่าสายปิดงานที่แลกความเร็วกับพลังบีบและเกราะหนา"
        - "&7เด่นสุดเมื่อทีมเปิดข้อมูลให้แล้วและต้องการคนเข้าเก็บ kill"
        - ""
        - "&aPros: &fปิดเป้าหมาย revealed ได้แรงและยืนไฟต์ได้นาน"
        - "&cCons: &fถ้าไม่มีคนเปิดทางให้จะตามเกมยากมาก"
    exorcist:
      name: "Exorcist"
      desc:
        - "&7นักล่าสาย counter-utility ที่ล้างร่องรอยสกิลของ Hider"
        - "&7ยิ่งใช้หลังเจอ decoy หรือ trace ใหม่ ๆ ยิ่งได้ value สูง"
        - ""
        - "&aPros: &fล้าง Decoy และเปิดเผยคนที่เพิ่งใช้สกิล"
        - "&cCons: &fต้องอ่านจังหวะและอยู่ระยะใกล้พอ"
    falconer:
      name: "Falconer"
      desc:
        - "&7นักล่าสายสอดแนมทางอากาศที่ปล่อยเหยี่ยวไปแท็ก Hider ที่กำลังขยับ"
        - "&7พอเหยื่อเรืองแสงอยู่ใกล้ตัว คุณจะได้ความเร็วเสริมไว้ปิดงาน"
        - ""
        - "&aPros: &fเปิดไล่เป้าหมายที่ขยับหนีได้คมมาก"
        - "&cCons: &fถ้าเหยื่อไม่ขยับหรือทีมไม่ตามซ้ำ มูลค่าจะตก"
    warden:
      name: "Warden"
      desc:
        - "&7นักล่าสายคุมเลนที่ลงโทษคนขยับผ่านจุดสำคัญ"
        - "&7ตั้ง Echo Sentry ไว้ล็อกจุดตัดและทำให้เป้าที่ฝืนผ่านช้าลง"
        - ""
        - "&aPros: &fล็อก rotation และบีบเส้นทางหนีได้ชัด"
        - "&cCons: &fต้องอ่านเส้นทางให้ถูก ไม่งั้นค่า sentry จะหาย"
  perk:
    decoy:
      name: "Decoy"
      desc:
        - "คลิกขวาที่ Armor Stand เพื่อสร้างเป้าล่อปลอม"
        - "เอาไว้หลอกให้พวก Hunter ตีมั่ว หรือปิดบังที่ซ่อนจริงๆ"
    phase_shift:
      name: "Phase Shift"
      desc:
        - "คลิกขวาที่ Ender Pearl เพื่อย้ายตัวไปจุดลงสั้น ๆ ที่ปลอดภัยที่สุดด้านหน้า"
        - "เหมาะกับการตัดสายตาโดยไม่วาร์ปเข้าแลนด์จุดเสี่ยงจนโดนแอนตี้ชีตเล่นงาน"
    trickery:
      name: "Trickery"
      desc:
        - "ได้ Speed I ถาวรเพื่อคุมจังหวะไล่ล่าให้อยู่ในมือ"
        - "ใช้ความเร็วเปลี่ยนเส้นก่อนที่คนหาจะเล็งหรืออ่านทางได้ทัน"
    blinding_strike:
      name: "Blinding Strike"
      desc:
        - "การตีประชิดจะทำให้คนหาตาบอดช่วงสั้น ๆ"
        - "ใช้ก่อนตัดมุมหรือหลุดจากจังหวะไล่ระยะประชิด"
    bomb_shell:
      name: "Bomb Shell"
      desc:
        - "คลิกขวาที่ Firework Star เพื่อวางกับดักล่อระเบิดหนัก"
        - "เหมาะกับลงโทษการเช็กโลภด้วยดาเมจหนัก ตาบอด ช้า และกระเด็น"
    secret_passage:
      name: "Secret Passage"
      desc:
        - "คลิกขวาที่ Tripwire Hook เพื่อมุดผ่านสิ่งกีดขวางใกล้ตัว"
        - "ใช้ตัดเส้นไล่แล้วไปโผล่อีกฝั่งที่ปลอดภัยกว่า"
    mirror_image:
      name: "Mirror Image"
      desc:
        - "คลิกขวาที่ Echo Shard เพื่อแยกร่างลวงและทำให้ Hunter ใกล้ตัวหน้ามืดช่วงสั้น"
        - "ใช้ตอนคนหาเข้าประชิดแล้วและต้องการแค่หนึ่งจังหวะอ่านผิดเพื่อหนี"
    scanner_pulse:
      name: "Scanner Pulse"
      desc:
        - "คลิกขวาที่ Compass เพื่อปล่อย 5 คลื่นเรดาร์ออกไปไกลสุด 20 บล็อก"
        - "แต่ละคลื่นจะบอกแค่ระยะกับทิศคร่าว ๆ ไม่เปิดจุดพร็อพตรง ๆ"
    double_jump:
      name: "Double Jump"
      desc:
        - "กดกระโดดสองครั้งเพื่อพุ่งขึ้นและหมุนตำแหน่งได้ไวขึ้น"
        - "ใช้ยึดหลังคา หน้าต่าง และทางลัดแนวตั้งก่อนพร็อพจะรีเซ็ตมุมหนี"
    flare:
      name: "Flare"
      desc:
        - "คลิกขวาที่ Fire Charge เพื่อขว้าง flare reveal"
        - "ใช้บังคับให้พร็อพออกจากที่ซ่อนก่อนทีมจะเข้าเช็กห้อง"
    speed_ii:
      name: "Speed II"
      desc:
        - "ได้ Speed II ถาวรเพื่อโยนใยเป็นฟิลด์ก่อนและตามเก็บเป้าหมายที่ติดกับ"
        - "ใช้ความเร็วเพื่อยึด choke point ก่อนที่ฝ่ายแอบจะอ้อมหนีได้"
    bloodhound_sense:
      name: "Bloodhound Sense"
      desc:
        - "คลิกขวาที่ Bone เพื่อเปิดตำแหน่ง Hider ใกล้ตัวหนึ่งคน"
        - "ดีที่สุดหลังเจอเป้าครั้งแรก ตอนอีกฝ่ายพยายามตัดเส้นไล่"
    smoke_bomb:
      name: "Smoke Bomb"
      desc:
        - "คลิกขวาที่ Gunpowder เพื่อโยนควันซึ่งทำให้ Hider ตาบอดและช้าลง"
        - "เหมาะกับเปิดจังหวะบุกหรือยุบห้องก่อนที่พร็อพจะกระจายหนี"
    bounty_dash:
      name: "Bounty Dash"
      desc:
        - "คลิกขวาที่ Crossbow เพื่อพุ่งปิดระยะอย่างหนัก"
        - "ใช้หลัง reveal เป้าหมาย ตอนอีกฝ่ายเหลือพื้นที่หนีน้อยแล้ว"
    purge_pulse:
      name: "Purge Pulse"
      desc:
        - "คลิกขวาที่ Amethyst Shard เพื่อล้าง decoy และร่องรอยใกล้ตัว"
        - "ใช้ทันทีหลังฝ่ายแอบกด utility เพื่อจับรอยที่สดที่สุด"
    sky_sweep:
      name: "Sky Sweep"
      desc:
        - "คลิกขวาที่ Feather เพื่อปล่อยเหยี่ยวบินวนเหนือหัวนาน 10 วินาที"
        - "มันจะลากรอยจาง ๆ ไปหา Hider ใกล้ตัว แม้เป้าหมายจะหยุดนิ่งแล้ว"
    echo_sentry:
      name: "Echo Sentry"
      desc:
        - "คลิกขวาที่ Sculk Sensor เพื่อวาง sentry จับคนที่ขยับผ่านเลน"
        - "ใช้ชะลอการข้าม ตัด rotation และล็อกหนึ่งฝั่งของห้อง"
