  direction:
    front: "ahead"
    front_left: "front-left"
    left: "left"
    back_left: "back-left"
    back: "behind"
    back_right: "back-right"
    right: "right"
    front_right: "front-right"
  kit:
    chameleon:
      name: "Chameleon"
      desc:
        - "&7Baseline Hider that wins by blending into the room."
        - "&7Use Decoy to make Hunters waste checks on the wrong prop."
        - ""
        - "&aPros: &fStrong deception and room-read pressure"
        - "&cCons: &fNo escape tool once revealed"
    ghost:
      name: "Ghost"
      desc:
        - "&7Mobility Hider that breaks chases through walls."
        - "&7Phase Shift resets line-of-sight when pressure gets close."
        - ""
        - "&aPros: &fStrong escape through tight routes"
        - "&cCons: &fTeleport sound and particles expose your route"
    trickster:
      name: "Trickster"
      desc:
        - "&7Tempo Hider that survives by never running straight."
        - "&7Blind the pursuer, swap routes, and keep the chase messy."
        - ""
        - "&aPros: &fPermanent speed and melee blind"
        - "&cCons: &fSnow trail makes repeated paths easy to read"
    bomb_bug:
      name: "Bomb Bug"
      desc:
        - "&7Trap Hider that can actually punish Hunters with lethal burst."
        - "&7Set explosive bait where greedy checks will cost real health."
        - ""
        - "&aPros: &fReal kill pressure when Hunters over-check"
        - "&cCons: &fNeeds setup time and believable bait"
    locksmith:
      name: "Locksmith"
      desc:
        - "&7Route Hider that escapes through awkward barriers and corners."
        - "&7Best when the map has narrow choke points or hidden pathing."
        - ""
        - "&aPros: &fCan break pursuit through route tricks"
        - "&cCons: &fWeak if the room offers no usable escape line"
    mimic:
      name: "Mimic"
      desc:
        - "&7Illusion Hider that splits attention before changing position."
        - "&7Mirror Image buys a short window to reroute the chase."
        - ""
        - "&aPros: &fGood at confusing single-target pursuit"
        - "&cCons: &fIllusions fade fast if Hunters wait you out"
    tracker:
      name: "Tracker"
      desc:
        - "&7Scout Hunter that narrows the map before the team commits."
        - "&7Use Scanner Pulse to confirm sectors, then rotate with Double Jump."
        - ""
        - "&aPros: &fReliable information and fast vertical sweep"
        - "&cCons: &fNeeds follow-up to convert scans into kills"
    destroyer:
      name: "Destroyer"
      desc:
        - "&7Area-pressure Hunter that checks suspicious rooms with force."
        - "&7Flare reveals clustered Hiders before you step into the room."
        - ""
        - "&aPros: &fStrong room breach and reveal pressure"
        - "&cCons: &fSlower rotations between fights"
    trapper:
      name: "Trapper"
      desc:
        - "&7Zone-control Hunter that wins by denying escape routes."
        - "&7Webs and bow turn choke points into easy follow-up kills."
        - ""
        - "&aPros: &fExcellent catch potential and chase control"
        - "&cCons: &fLight armor in open fights"
    bloodhound:
      name: "Bloodhound"
      desc:
        - "&7Chase Hunter that turns first contact into a full track."
        - "&7Use Bloodhound Sense to keep pressure on runners and route breakers."
        - ""
        - "&aPros: &fFast pursuit and single-target tracking"
        - "&cCons: &fNo wide-area reveal or ranged finisher"
    saboteur:
      name: "Saboteur"
      desc:
        - "&7Disruption Hunter that starts fights on your terms."
        - "&7Smoke Bomb blinds and slows Hiders for a clean collapse."
        - ""
        - "&aPros: &fStrong opener and anti-hide utility"
        - "&cCons: &fWeak solo cleanup if the engage misses"
    bounty_hunter:
      name: "Bounty Hunter"
      desc:
        - "&7Bruiser Hunter that finishes revealed targets with raw pressure."
        - "&7Heavy armor buys time until Bounty Dash closes the last gap."
        - ""
        - "&aPros: &fHigh cleanup power and strong armor"
        - "&cCons: &fVery slow without information or setup"
    exorcist:
      name: "Exorcist"
      desc:
        - "&7Counter-utility Hunter that punishes lingering Hider magic."
        - "&7Best used after decoys, traces, or recent skill effects appear."
        - ""
        - "&aPros: &fPurges Decoys and reveals recent skill users"
        - "&cCons: &fNeeds timing and close-range positioning"
    falconer:
      name: "Falconer"
      desc:
        - "&7Aerial scout that sends a hawk to tag moving Hiders."
        - "&7Once prey glows, Falconer gets the speed to close the chase."
        - ""
        - "&aPros: &fClear chase payoff after a successful sweep"
        - "&cCons: &fLoses value when Hiders can stay still and boxed in"
    warden:
      name: "Warden"
      desc:
        - "&7Lane-control Hunter that punishes movers crossing key routes."
        - "&7Echo Sentry locks one crossover and slows anyone trying to slip through."
        - ""
        - "&aPros: &fReliable hold pressure on doors, flanks, and choke points"
        - "&cCons: &fStatic utility and weaker value in wide open maps"
  perk:
    decoy:
      name: "Decoy"
      desc:
        - "Right-click Armor Stand to place a fake prop check."
        - "Best for baiting spam-hits or covering your real hiding spot."
    phase_shift:
      name: "Phase Shift"
      desc:
        - "Right-click Ender Pearl to blink to the safest short exit in front of you."
        - "Best used to break line-of-sight without clipping into bad anticheat landings."
    trickery:
      name: "Trickery"
      desc:
        - "Permanent Speed I keeps your chase tempo high."
        - "Use it to change routes before Hunters can settle their aim."
    blinding_strike:
      name: "Blinding Strike"
      desc:
        - "Melee hits briefly Blind Hunters."
        - "Best used right before cutting a corner or escaping a tight chase."
    bomb_shell:
      name: "Bomb Shell"
      desc:
        - "Right-click Firework Star to plant a heavy explosive decoy trap."
        - "Best for punishing greedy checks with real damage, blind, and knockback."
    secret_passage:
      name: "Secret Passage"
      desc:
        - "Right-click Tripwire Hook to slip through a nearby barrier."
        - "Use it to cut a chase route and reappear on the safer side of a wall."
    mirror_image:
      name: "Mirror Image"
      desc:
        - "Right-click Echo Shard to split illusions and briefly blind nearby Hunters."
        - "Use it when pursuit is already close and one wrong read buys your escape."
    scanner_pulse:
      name: "Scanner Pulse"
      desc:
        - "Right-click Compass to send 5 radar waves out to 20 blocks."
        - "Each wave only tells rough distance and direction, not the exact prop."
    double_jump:
      name: "Double Jump"
      desc:
        - "Tap jump twice to launch upward and rotate faster."
        - "Use it to claim roofs, windows, and vertical shortcuts before props reset."
    flare:
      name: "Flare"
      desc:
        - "Right-click Fire Charge to throw a revealing flare."
        - "Use it to force hidden props out before committing to a room check."
    speed_ii:
      name: "Speed II"
      desc:
        - "Permanent Speed II helps you throw web fields first and chase trapped Hiders."
        - "Use your speed to claim choke points before the Hider can route around them."
    bloodhound_sense:
      name: "Bloodhound Sense"
      desc:
        - "Right-click Bone to reveal one nearby Hider."
        - "Best after first contact, when a runner is trying to break your chase route."
    smoke_bomb:
      name: "Smoke Bomb"
      desc:
        - "Right-click Gunpowder to throw a smoke bomb that blinds and slows Hiders."
        - "Best used to open a push or collapse on a room before props can scatter."
    bounty_dash:
      name: "Bounty Dash"
      desc:
        - "Right-click Crossbow to launch a heavy gap-closing dash."
        - "Best used after a reveal, when the target has little space left to escape."
    purge_pulse:
      name: "Purge Pulse"
      desc:
        - "Right-click Amethyst Shard to purge nearby decoys and traces."
        - "Use it right after Hiders spend utility to catch the freshest trail."
    sky_sweep:
      name: "Sky Sweep"
      desc:
        - "Right-click Feather to keep a hawk circling overhead for 10 seconds."
        - "It traces faint tracks toward nearby Hiders, even if they stop moving."
    echo_sentry:
      name: "Echo Sentry"
      desc:
        - "Right-click Sculk Sensor to deploy a sentry that catches movers in one lane."
        - "Use it to slow crossings, break rotations, and lock one side of the room."
