        1: "Throws a brightly burning flare."
        2: "Reveals hiders caught in its radius."
    bloodhound_sense:
      name: "Bloodhound Sense"
      lore:
        1: "Sniffs out one nearby hider."
        2: "Gives a clean chase line for the next collapse."
    smoke_bomb:
      name: "Smoke Bomb"
      lore:
        1: "Creates a thick cloud of smoke."
        2: "Blinds nearby hiders."
    bounty_dash:
      name: "Bounty Dash"
      lore:
        1: "Dashes quickly in the facing direction."
        2: "Gain speed boost temporarily."
    purge_pulse:
      name: "Purge Pulse"
      lore:
        1: "Emits a pulse that forces hiders out."
        2: "Destroys nearby traps and decoys."
    sky_sweep:
      name: "Sky Sweep"
      lore:
        1: "Keeps a hawk circling overhead for 10 seconds."
        2: "Follows hidden paths with faint tracks, even on still Hiders."
    echo_sentry:
      name: "Echo Sentry"
      lore:
        1: "Deploys a lane sentry that catches movers."
        2: "Slows and reveals anyone crossing its zone."
