name: HouziGate
version: 1.0.0
main: com.houzicore.gateway.GatewayPlugin
api-version: '1.21'
description: Gateway authentication plugin for HouziCore network
authors: [HouziCore]

commands:
  hzgate-submit:
    description: Internal command fired by the Dialog API on form submit
    usage: /hzgate-submit <password>
    permission: houzigate.use
  2fa:
    description: Set or manage your 2FA PIN (must be authenticated)
    usage: /2fa set <pin>
    permission: houzigate.use
  gateadmin:
    description: Admin commands for HouziGate
    usage: /gateadmin <resetpass|trustip|cleartrust|forceauth|listips>
    permission: houzigate.admin

permissions:
  houzigate.use:
    description: Allow players to use auth commands
    default: true
  houzigate.admin:
    description: Admin access to HouziGate
    default: op
  houzigate.staff:
    description: Staff rank - enforces 2FA on IP change
    default: false
  houzigate.bypass:
    description: Bypass all auth (e.g. admins with premium accounts)
    default: false
