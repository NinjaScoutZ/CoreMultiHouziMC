plugins {
    id 'java'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.github.gmazzo.buildconfig' version '6.0.9'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
    id 'com.vanniktech.maven.publish' version "0.36.0"
    id 'io.freefair.lombok' version "9.2.0"
}

group = "com.houzicore.extension"
version = project_version

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'com.github.gmazzo.buildconfig'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'xyz.wagyourtail.jvmdowngrader'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'io.freefair.lombok'

    compileJava.options.encoding = 'UTF-8'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = java_version
        targetCompatibility = java_version
        withSourcesJar()
    }

    repositories {
        mavenCentral()

        maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url = "https://oss.sonatype.org/content/groups/public/" }
        maven { url = "https://repo.aikar.co/content/groups/aikar/" }
        maven { url = "https://repo.codemc.io/repository/maven-releases/" }
        maven { url = "https://repo.codemc.io/repository/ArikSquad/" }
        maven { url = "https://repo.helpch.at/releases/" }
        maven { url = "https://repo.alessiodp.com/snapshots" }
        maven { url = "https://libraries.minecraft.net" }
        maven { url = "https://maven.maxhenkel.de/repository/public" }
        maven { url = "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
        maven { url = "https://repo.plasmoverse.com/releases" }
        maven { url = "https://repo.plasmoverse.com/snapshots" }
        maven { url = "https://repo.loohpjames.com/repository" }
        maven { url = "https://repo.diogotc.com/releases" }
        maven { url = "https://repo.codemc.io/repository/maven-snapshots/" }
        maven { url = "https://maven.devs.beer/" }
        maven { url = "https://maven.nucleoid.xyz/" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://repo.opencollab.dev/main/" }
        maven { url = "https://mvn-repo.arim.space/affero-gpl3/" }
        maven { url = "https://mvn-repo.arim.space/lesser-gpl3/" }
        maven { url = "https://repo.william278.net/releases/" }
        maven { url = "https://maven.hytale.com/release" }
        maven { url = "https://maven.hytale.com/pre-release" }
        maven { url = "https://www.cursemaven.com" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = "https://repo.inventivetalent.org/repository/public/"}
        maven { url = "https://jitpack.io" }
    }

    dependencies {
        api "org.jspecify:jspecify:$jspecify_version"
        compileOnlyApi "org.mapstruct:mapstruct:$mapstruct_version"
        compileOnlyApi "org.projectlombok:lombok:$lombok_version"
        annotationProcessor "org.mapstruct:mapstruct-processor:$mapstruct_version"
        annotationProcessor "org.projectlombok:lombok:$lombok_version"

        compileOnly "com.google.inject:guice:$guice_version"
        compileOnly "tools.jackson.dataformat:jackson-dataformat-yaml:$jackson_dataformat_version"
        compileOnly "net.kyori:adventure-api:$adventure_api"
        compileOnly "net.kyori:adventure-text-serializer-legacy:$adventure_api"
        compileOnly "net.kyori:adventure-text-minimessage:$adventure_api"
        compileOnly "net.kyori:adventure-text-serializer-gson:$adventure_api"
        compileOnly "net.kyori:adventure-text-serializer-plain:$adventure_api"
        compileOnly "org.apache.commons:commons-text:$apache_commons_text_version"
        compileOnly "it.unimi.dsi:fastutil:$fastutil_version"
    }

    buildConfig {
        className("BuildConfig")
        packageName("com.houzicore.extension")
        rootProject.ext.properties.findAll { key, value ->
            !key.contains('.')
        }.each { key, value ->
            buildConfigField(String, key.toString().toUpperCase(), value)
        }
    }

    downgradeJar {
        quiet = true
        downgradeTo = JavaVersion.VERSION_17
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('encoding', 'UTF-8')
        options.addStringOption('charSet', 'UTF-8')
    }

    tasks.register("buildFinalJar", Jar) {
        archiveFileName = "HouziExtension-" + project.name + "-" + project_version + ".jar"
        destinationDirectory = file("$rootDir/build/libs")
    }

    shadowJar {
        relocate("com.zaxxer.hikari", "com.houzicore.extension.library.hikari")
        relocate("org.jdbi", "com.houzicore.extension.library.jdbi3")
        relocate("com.alessiodp.libby", "com.houzicore.extension.library.libby")
        relocate("spark.", "com.houzicore.extension.library.spark.")
        relocate("org.apache.commons", "com.houzicore.extension.library.apache")
        relocate("com.fasterxml.jackson", "com.houzicore.extension.library.jackson")
        relocate("tools.jackson", "com.houzicore.extension.library.jackson")
        relocate("org.snakeyaml.engine", "com.houzicore.extension.library.snakeyaml")
        relocate("io.lettuce", "com.houzicore.extension.library.lettuce")
        relocate("it.unimi.dsi", "com.houzicore.extension.library.fastutil")

        from(rootProject.file('LICENSE')) {
            into('/')
        }

        if (project.name != "fabric") {
            relocate("org.incendo", "com.houzicore.extension.library.cloud")
        }

        if (project.name != "paper" && project.name != "fabric") {
            relocate("com.github.retrooper.packetevents", "com.houzicore.extension.library.packetevents")
            relocate("io.github.retrooper.packetevents", "com.houzicore.extension.library.packetevents.impl")
            relocate("net.kyori.adventure", "com.houzicore.extension.library.adventure")
            relocate("com.google.gson", "com.houzicore.extension.library.gson")
        }

        if (project.name != "velocity") {
            relocate("com.google.inject", "com.houzicore.extension.library.guice")
            relocate("com.google.common", "com.houzicore.extension.library.guava")
        }

        outputs.cacheIf { true }

        minimize()
    }

    mavenPublishing {
        publishToMavenCentral(true)
        coordinates("com.houzicore.extension", project.name, project_version)

        pom {
            name = "HouziExtension ${project.name.capitalize()}"
            description = "Every Message Under Your Control!"
            url = 'https://github.com/Houzi/HouziExtension'
            licenses {
                license {
                    name = 'GNU General Public License v3.0'
                    url = 'https://www.gnu.org/licenses/gpl-3.0'
                }
            }

            developers {
                developer {
                    id = 'HouziCore Development'
                    name = 'HouziCore Development'
                    email = 'artem.mochalin11@gmail.com'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/Houzi/HouziExtension.git'
                developerConnection = 'scm:git:ssh://github.com/Houzi/HouziExtension.git'
                url = 'https://github.com/Houzi/HouziExtension'
            }
        }

        signAllPublications()
    }

}